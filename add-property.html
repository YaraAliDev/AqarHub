<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة عقار جديد | AqarHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">AqarHub</a>
        <nav class="navbar">
            <a href="index.html">الرئيسية</a>
            <a href="favorites.html">المفضلة</a>
        </nav>
    </header>

    <main class="properties-section">
        <div class="section-heading">
            <h1>أضف عقارك الآن</h1>
            <p>اعرض عقارك وساعد العملاء في العثور عليه</p>
        </div>

        <form id="propertyForm" class="search-box">

            <div class="search-field">
                <label>عنوان العقار</label>
                <input type="text" id="title" placeholder="مثال: شقة فاخرة" required>
            </div>

            <div class="search-field">
                <label>المحافظة</label>
                <select id="location" required>
                    <option value="">اختاري المحافظة</option>
                    <option value="القاهرة">القاهرة</option>
                    <option value="الجيزة">الجيزة</option>
                    <option value="الشرقية">الشرقية</option>
                    <option value="الإسكندرية">الإسكندرية</option>
                </select>
            </div>

            <div class="search-field">
                <label>نوع العقار</label>
                <select id="type" required>
                    <option value="">اختاري النوع</option>
                    <option value="شقة">شقة</option>
                    <option value="فيلا">فيلا</option>
                    <option value="مكتب">مكتب</option>
                </select>
            </div>

            <div class="search-field">
                <label>الغرض</label>
                <select id="purpose" required>
                    <option value="">اختاري الغرض</option>
                    <option value="بيع">بيع</option>
                    <option value="إيجار">إيجار</option>
                </select>
            </div>

            <div class="search-field">
                <label>السعر بالجنيه</label>
                <input type="number" id="price" min="1" placeholder="السعر" required>
            </div>

            <div class="search-field">
                <label>المساحة بالمتر</label>
                <input type="number" id="area" min="1" placeholder="المساحة" required>
            </div>

            <div class="search-field">
                <label>عدد الغرف</label>
                <input type="number" id="rooms" min="1" placeholder="عدد الغرف" required>
            </div>

            <div class="search-field">
                <label>صورة العقار</label>
                <input type="file" id="image" accept="image/*" required>
            </div>

            <button type="submit" class="search-btn">
                نشر العقار
            </button>

        </form>
    </main>

    <script src="add-property.js"></script>

</body>
</html>
